name: Construire l'APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Vérifier le moteur (séances, révisions, points)
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest --no-daemon --stacktrace

      - name: Construire
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk BiBisaya.apk

      - name: Garder l'APK avec cette construction
        uses: actions/upload-artifact@v4
        with:
          name: BiBisaya-apk
          path: BiBisaya.apk

      - name: Publier la version à télécharger
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: BiBisaya 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Pour installer : télécharge **BiBisaya.apk** depuis ton téléphone (dans Chrome), ouvre-le, puis accepte l'installation.
            Ta progression est gardée quand tu installes une nouvelle version par-dessus.
          files: BiBisaya.apk
          make_latest: true

  # Des captures d'écran de l'appli (en mode démo), pour vérifier le design sur un vrai Android.
  captures:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: BiBisaya-apk

      - name: Activer l'accélération de l'émulateur
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prendre les captures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/captures.sh BiBisaya.apk captures

      - name: Garder les captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: captures/

      - name: Ranger les captures dans la branche « captures »
        if: always()
        run: |
          cd captures
          git init -q -b captures
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Captures de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" captures
